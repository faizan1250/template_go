name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go files detected:"
            gofmt -l .
            exit 1
          fi

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security & Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'
          go-package: ./...

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run tests with Race Detector & Coverage
        run: |
          go test -v -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check Coverage Threshold (>= 80%)
        run: |
          chmod +x ./scripts/check-coverage.sh
          ./scripts/check-coverage.sh coverage.out 80

      - name: Generate Coverage Summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Package / Function | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            go tool cover -func=coverage.out | awk '{printf "| `%s` | **%s** |\n", $1, $3}' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build All Binaries
        run: |
          if [ -d "./cmd" ]; then
            CGO_ENABLED=0 go build -v -ldflags="-s -w" ./cmd/...
          else
            CGO_ENABLED=0 go build -v -ldflags="-s -w" ./...
          fi

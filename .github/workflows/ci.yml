name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(find . -name '*.go' -not -path '*/vendor/*')" ]; then
            if [ -n "$(gofmt -l .)" ]; then
              echo "Unformatted Go files detected:"
              gofmt -l .
              exit 1
            fi
          else
            echo "No Go source files found yet. Skipping format check."
          fi

      - name: Golangci-lint
        if: hashFiles('**/*.go') != ''
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Report Empty State (Lint)
        if: hashFiles('**/*.go') == ''
        run: echo "No Go source files to lint yet."

  security:
    name: Security & Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run govulncheck
        if: hashFiles('**/*.go') != ''
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'
          go-package: ./...

      - name: Report Empty State (Security)
        if: hashFiles('**/*.go') == ''
        run: echo "No Go packages to scan yet."

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run tests with Race Detector & Coverage
        run: |
          if [ -n "$(find . -name '*_test.go' -not -path '*/vendor/*')" ]; then
            go test -v -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
          else
            echo "No test files (*_test.go) found yet. Creating empty coverage profile."
            touch coverage.out
          fi

      - name: Check Coverage Threshold (>= 80%)
        run: |
          chmod +x ./scripts/check-coverage.sh
          ./scripts/check-coverage.sh coverage.out 80

      - name: Generate Coverage Summary
        if: always()
        run: |
          if [ -s coverage.out ]; then
            echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Package / Function | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            go tool cover -func=coverage.out | awk '{printf "| `%s` | **%s** |\n", $1, $3}' >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "No tests or coverage data generated yet." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        if: hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build All Binaries
        run: |
          if [ -d "./cmd" ]; then
            CGO_ENABLED=0 go build -v -ldflags="-s -w" ./cmd/...
          elif [ -n "$(find . -maxdepth 1 -name '*.go')" ]; then
            CGO_ENABLED=0 go build -v -ldflags="-s -w" ./...
          else
            echo "No Go source code to build yet."
          fi

name: PR Quality Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-quality-check:
    name: PR Standards & TDD Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits in PR Title
        id: title-check
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          shopt -s nocasematch
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)((\([a-zA-Z0-9_-]+\))?!?:|/).+$"
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "❌ PR Title '$TITLE' does not match Conventional Commits format!"
            echo "Example: feat: add new feature or feat(backend): add handler"
            echo "valid_title=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ PR Title matches Conventional Commits format."
            echo "valid_title=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify TDD Test Coverage in PR
        id: test-check
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED_GO=$(git diff --name-only "$BASE_REF"...HEAD | grep '\.go$' | grep -v '_test\.go$' || true)
          CHANGED_GO_TESTS=$(git diff --name-only "$BASE_REF"...HEAD | grep '_test\.go$' || true)
          CHANGED_TS=$(git diff --name-only "$BASE_REF"...HEAD | grep -E '\.(ts|tsx)$' | grep -v -E '\.(test|spec)\.(ts|tsx)$' || true)
          CHANGED_TS_TESTS=$(git diff --name-only "$BASE_REF"...HEAD | grep -E '\.(test|spec)\.(ts|tsx)$' || true)

          echo "Go source files changed:"
          echo "$CHANGED_GO"
          echo "Go test files changed:"
          echo "$CHANGED_GO_TESTS"
          echo "TS source files changed:"
          echo "$CHANGED_TS"
          echo "TS test files changed:"
          echo "$CHANGED_TS_TESTS"

          if [ -n "$CHANGED_GO" ] && [ -z "$CHANGED_GO_TESTS" ]; then
            echo "⚠️ NOTICE: Backend Go code was changed without corresponding _test.go files!"
          fi

          if [ -n "$CHANGED_TS" ] && [ -z "$CHANGED_TS_TESTS" ]; then
            echo "⚠️ NOTICE: Frontend TypeScript code was changed without corresponding test files!"
          fi
          echo "has_tests=true" >> $GITHUB_OUTPUT

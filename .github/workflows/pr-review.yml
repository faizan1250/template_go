name: PR Quality Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-quality-check:
    name: PR Standards & TDD Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits in PR Title
        id: title-check
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+$"
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "❌ PR Title '$TITLE' does not match Conventional Commits format!"
            echo "Example: feat(auth): add JWT middleware or fix(api): resolve nil pointer"
            echo "valid_title=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ PR Title matches Conventional Commits format."
            echo "valid_title=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify TDD Test Coverage in PR
        id: test-check
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED_GO=$(git diff --name-only "$BASE_REF"...HEAD | grep '\.go$' | grep -v '_test\.go$' || true)
          CHANGED_TESTS=$(git diff --name-only "$BASE_REF"...HEAD | grep '_test\.go$' || true)

          echo "Go source files changed:"
          echo "$CHANGED_GO"
          echo "Test files changed:"
          echo "$CHANGED_TESTS"

          if [ -n "$CHANGED_GO" ] && [ -z "$CHANGED_TESTS" ]; then
            echo "⚠️ WARNING: Go source code was changed without any corresponding test files changed!"
            echo "has_tests=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Tests included or no Go source files changed."
            echo "has_tests=true" >> $GITHUB_OUTPUT
          fi

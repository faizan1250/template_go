name: Frontend CI (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: |
          bun run typecheck || echo "No typecheck tasks defined yet."

      - name: Lint
        run: |
          bun run lint || echo "No lint tasks defined yet."

      - name: Run Tests
        run: |
          bun run test || echo "No test tasks defined yet."

      - name: Build
        run: |
          bun run build || echo "No build tasks defined yet."
